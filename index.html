<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agência Foco — Relatório de Meta Ads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,600;1,700&display=swap" rel="stylesheet">
<style>
:root {
  --blue:       #1168C8;   /* azul performance — primary */
  --blue-deep:  #0B386D;   /* azul profundo — headings / sidebar */
  --blue-title: #0A618D;   /* azul institucional */
  --blue-soft:  #3DA0E6;   /* azul claro — light accent */
  --blob:       #DCEBFB;
  --blob2:      #EAF3FD;
  --circle:     #DEEBFC;
  --circle2:    #EAF3FD;
  --ice:        #EAF3FD;
  --ice2:       #F3F9FE;
  --white:      #FFFFFF;
  --ink:        #23303D;
  --ink2:       #435264;
  --ink3:       #7A8A99;
  --line:       #E4EEF9;
  --navy:       #0B386D;
  --green:      #16A34A;
  --red:        #DC2626;
  --shadow:     0 8px 30px rgba(17,104,200,.10);
  --shadow-sm:  0 4px 18px rgba(17,104,200,.08);
  --r-card:     20px;
  --r-pill:     100px;
  --sidebar-w:  72px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Montserrat', 'Segoe UI', sans-serif;
  background: #EEF6FE;
  min-height: 100vh;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

/* ── APP SHELL / SIDEBAR ── */
.app-shell { display: flex; min-height: 100vh; }
.sidebar {
  width: var(--sidebar-w); flex-shrink: 0; background: var(--blue-deep);
  display: flex; flex-direction: column; align-items: center; gap: 22px;
  padding: 18px 0 16px; position: sticky; top: 0; height: 100vh;
}
.side-mark {
  width: 34px; height: 34px; border-radius: 10px; background: var(--blue);
  color: white; display: flex; align-items: center; justify-content: center;
  font-family: 'Montserrat',sans-serif; font-weight: 800; font-size: 15px; margin-bottom: 6px;
}
.side-nav { display: flex; flex-direction: column; gap: 6px; }
.side-ico {
  width: 40px; height: 40px; border-radius: 12px; border: none; cursor: pointer;
  background: transparent; color: #7FAEDD; display: flex; align-items: center; justify-content: center;
  transition: background .15s, color .15s;
}
.side-ico:hover { background: rgba(255,255,255,.08); color: #BFE0FF; }
.side-ico.active { background: rgba(255,255,255,.14); color: white; }
.side-bottom { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.side-avatar {
  width: 34px; height: 34px; border-radius: 50%; background: var(--blue-soft); color: white;
  display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800;
  position: relative; font-family: 'Montserrat',sans-serif;
}
.avatar-dot { position:absolute; right:-1px; bottom:-1px; width:9px; height:9px; border-radius:50%; background:var(--green); border:2px solid var(--blue-deep); }
.main { flex: 1; min-width: 0; }

/* ── TOP BAR ── */
.setup-bar {
  background: var(--white); border-bottom: 1px solid var(--line);
  padding: 12px 20px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.setup-bar label { color: var(--ink3); font-size: 11px; font-weight: 800; white-space: nowrap; letter-spacing: .5px; text-transform: uppercase; }
.setup-bar select {
  padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--line);
  font-size: 12px; background: var(--ice2); color: var(--ink); cursor: pointer;
  font-family: inherit; font-weight: 700;
}
.btn-connect {
  background: var(--blue); color: white; border: none; padding: 9px 20px;
  border-radius: 10px; font-size: 12px; font-weight: 800; cursor: pointer;
  letter-spacing: .3px; font-family: inherit; box-shadow: 0 4px 14px rgba(17,104,200,.30);
  transition: transform .15s, box-shadow .15s;
}
.btn-connect:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(17,104,200,.4); }
.btn-connect:disabled { opacity: .55; cursor: default; transform: none; }
.btn-bulk { background: var(--green); box-shadow: 0 4px 14px rgba(22,163,74,.3); margin-left: auto; }
.btn-bulk:hover { box-shadow: 0 6px 20px rgba(22,163,74,.4); }

/* ── TABS ── */
.tabs-wrap {
  background: var(--white); border-bottom: 1.5px solid var(--line);
  display: flex; flex-wrap: wrap; padding: 6px 20px;
  position: sticky; top: 0; z-index: 10;
  box-shadow: 0 2px 16px rgba(17,104,200,.06);
  max-height: 96px; overflow-y: auto;
}
.tab {
  display: inline-block; padding: 9px 13px; cursor: pointer;
  font-size: 12px; font-weight: 700; color: var(--ink3); white-space: nowrap;
  border-bottom: 3px solid transparent; transition: all .15s; user-select: none;
}
.tab:hover { color: var(--blue); }
.tab.active { color: var(--blue); border-bottom-color: var(--blue); }

/* ── PAGE ── */
.page { max-width: 1360px; margin: 0 auto; padding: 22px 22px 50px; }
#exportTarget { background: var(--white); border-radius: 26px; padding: 26px 26px 22px; border: 1px solid var(--line); box-shadow: var(--shadow); }

/* ── REPORT HEADER ── */
.r-header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.r-ico { width: 58px; height: 58px; border-radius: 16px; background: var(--blue-deep); color: white; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.r-ico svg { width: 28px; height: 28px; }
.r-title-wrap { flex: 1; min-width: 220px; }
.r-eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .12em; color: var(--ink3); text-transform: uppercase; }
.r-title { font-size: 30px; font-weight: 800; color: var(--blue-deep); line-height: 1.15; }
.r-sub { font-size: 13.5px; font-weight: 700; color: var(--ink2); margin-top: 2px; }
.r-sub b { color: var(--blue); }
.r-pills { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pill {
  display: inline-flex; align-items: center; gap: 7px; background: var(--ice2);
  border: 1px solid var(--line); border-radius: 12px; padding: 8px 13px;
  font-size: 12px; font-weight: 700; color: var(--ink2); white-space: nowrap;
}
.pill svg { color: var(--blue); flex-shrink: 0; }
.pill.sync { background: #E8F7EE; border-color: #BEEBCF; color: var(--green); }
.pill.sync svg { color: var(--green); }
.pill .caret { color: var(--ink3); margin-left: 2px; }

/* ── KPI ROW ── */
.kpi-row { display: grid; grid-template-columns: repeat(6,1fr); gap: 12px; margin-bottom: 18px; }
.kpi-card { background: var(--ice2); border: 1px solid var(--line); border-radius: 16px; padding: 15px 14px 13px; }
.kpi-top { display:flex; align-items:center; gap:9px; margin-bottom: 10px; }
.kpi-ico { width: 32px; height: 32px; border-radius: 9px; background: var(--white); color: var(--blue); display:flex; align-items:center; justify-content:center; box-shadow: var(--shadow-sm); flex-shrink:0; }
.kpi-ico svg { width: 16px; height: 16px; }
.kpi-label { font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--ink3); line-height: 1.25; }
.kpi-value { font-size: 21px; font-weight: 900; color: var(--blue-deep); line-height: 1; }
.kpi-foot { display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap; }
.delta { font-size: 11px; font-weight: 800; display:inline-flex; align-items:center; gap:3px; }
.delta.good { color: var(--green); }
.delta.bad { color: var(--red); }
.kpi-extra { font-size: 10.5px; font-weight: 700; color: var(--ink3); }
@media (max-width: 1100px) { .kpi-row { grid-template-columns: repeat(3,1fr); } }
@media (max-width: 620px) { .kpi-row { grid-template-columns: repeat(2,1fr); } }

/* ── GRID / SECTION ── */
.grid-3 { display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 14px; margin-bottom: 14px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
.grid-4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 14px; }
@media (max-width: 1000px) { .grid-3, .grid-2, .grid-4 { grid-template-columns: 1fr; } }
.section { background: var(--white); border: 1px solid var(--line); border-radius: var(--r-card); padding: 18px 18px 16px; box-shadow: var(--shadow-sm); }
.sec-title { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; }
.sec-ico { width: 30px; height: 30px; border-radius: 9px; background: var(--circle); color: var(--blue); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.sec-ico svg { width: 15px; height: 15px; }
.sec-h { font-size: 13px; font-weight: 800; color: var(--ink); letter-spacing: .01em; }

/* ── FUNNEL ── */
.funnel-row { display: grid; grid-template-columns: 170px 1fr 60px; align-items: center; gap: 10px; margin-bottom: 11px; font-size: 12.5px; }
.funnel-label { display: flex; align-items: center; gap: 8px; color: var(--ink2); font-weight: 700; }
.funnel-label svg { color: var(--blue); flex-shrink: 0; width:15px; height:15px; }
.funnel-label .fv { color: var(--ink); font-weight: 900; margin-left: auto; padding-right: 6px; }
.funnel-track { height: 9px; border-radius: 5px; background: var(--ice2); overflow: hidden; border: 1px solid var(--line); }
.funnel-fill { height: 100%; border-radius: 5px; background: linear-gradient(90deg, var(--blue-deep), var(--blue)); }
.funnel-pct { text-align: right; color: var(--ink3); font-weight: 700; }
.funnel-note { background: var(--ice2); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; font-size: 12px; color: var(--ink2); margin-top: 10px; line-height: 1.5; }
.funnel-note b { color: var(--blue); }

/* ── CHARTS ── */
.chart-head { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom: 6px; }
.chart-total { text-align: right; }
.chart-total .ct-l { font-size: 10px; color: var(--ink3); font-weight: 700; text-transform: uppercase; }
.chart-total .ct-v { font-size: 17px; font-weight: 900; color: var(--blue-deep); }
.no-data { color: var(--ink3); font-size: 12.5px; text-align: center; padding: 30px 0; font-weight: 600; }

/* ── RANKING TABLE ── */
table.rank { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.rank th { text-align: left; font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--ink3); padding: 0 8px 8px; border-bottom: 1px solid var(--line); }
table.rank td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.rank tr:last-child td { border-bottom: none; }
.rank-num { width: 22px; height: 22px; border-radius: 7px; background: var(--circle); color: var(--blue); font-weight: 800; font-size: 11px; display: flex; align-items: center; justify-content: center; }
.rank-camp { display: flex; align-items: center; gap: 9px; }
.rank-camp-ico { width: 30px; height: 30px; border-radius: 9px; background: var(--circle2); color: var(--blue); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.rank-camp-ico svg { width: 14px; height: 14px; }
.rank-camp-name { font-weight: 800; color: var(--ink); max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
td.num { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ink2); }
td.trend { text-align: center; }
.trend-ico.up { color: var(--red); } .trend-ico.down { color: var(--green); }
.rank-more { text-align: center; margin-top: 10px; }
.rank-more a { font-size: 12px; font-weight: 800; color: var(--blue); text-decoration: none; }
.rank-more a:hover { text-decoration: underline; }

/* ── DONUT ── */
.donut-wrap { display: flex; align-items: center; gap: 18px; }
.donut-center { position: relative; }
.donut-total { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.donut-total .dt-l { font-size: 9px; color: var(--ink3); font-weight: 700; text-transform: uppercase; }
.donut-total .dt-v { font-size: 15px; font-weight: 900; color: var(--blue-deep); }
.legend { display: flex; flex-direction: column; gap: 9px; flex: 1; min-width: 0; }
.legend-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.legend-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink2); font-weight: 700; }
.legend-pct { font-weight: 900; color: var(--ink); }

/* ── ADS LIST ── */
.ad-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.ad-item:first-child { padding-top: 2px; }
.ad-item:last-child { border-bottom: none; padding-bottom: 2px; }
.rank-badge { width: 26px; height: 26px; min-width: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 12px; flex-shrink: 0; }
.rb-1 { background: linear-gradient(135deg, #FCD34D, #F59E0B); color: #7C3A00; }
.rb-2 { background: linear-gradient(135deg, #D9DEE6, #AEB6C2); color: #34404F; }
.rb-3 { background: linear-gradient(135deg, #E1A46A, #C57B36); color: white; }
.ad-thumb { width: 48px; height: 48px; min-width: 48px; border-radius: 12px; object-fit: cover; background: var(--ice); border: 1px solid var(--line); }
.ad-thumb-ph { width: 48px; height: 48px; min-width: 48px; border-radius: 12px; background: var(--circle2); display: flex; align-items: center; justify-content: center; color: var(--blue-soft); border: 1px solid var(--line); }
.ad-thumb-ph svg { width: 20px; height: 20px; }
.ad-info { flex: 1; min-width: 0; }
.ad-name { font-size: 12.5px; font-weight: 800; color: var(--ink); margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ad-metrics { display: flex; gap: 16px; }
.ad-metrics .am-l { font-size: 9px; color: var(--ink3); font-weight: 700; text-transform: uppercase; }
.ad-metrics .am-v { font-size: 12.5px; font-weight: 900; color: var(--blue-deep); }
.top1-seal { display:inline-flex; align-items:center; gap:4px; background: linear-gradient(135deg, #FCD34D, #F59E0B); color: #7C3A00; font-size: 9px; font-weight: 900; padding: 3px 9px; border-radius: 100px; margin-bottom: 8px; letter-spacing:.3px; }

/* ── AUDIENCE ── */
.audience-grid { display: grid; grid-template-columns: .8fr 1.1fr 1.1fr; gap: 16px; align-items: start; }
@media (max-width: 900px) { .audience-grid { grid-template-columns: 1fr; } }
.gender-legend { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.age-bar-row { display: grid; grid-template-columns: 40px 1fr 34px; align-items: center; gap: 8px; font-size: 11.5px; margin-bottom: 8px; }
.age-bar-track { height: 10px; border-radius: 5px; background: var(--ice2); overflow: hidden; }
.age-bar-fill { height: 100%; border-radius: 5px; background: var(--blue); }
.age-bar-pct { text-align: right; font-weight: 800; color: var(--ink2); }
.place-row { display: flex; align-items: center; gap: 9px; font-size: 11.5px; margin-bottom: 10px; }
.place-ico { width: 22px; height: 22px; border-radius: 7px; background: var(--circle); color: var(--blue); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.place-ico svg { width: 11px; height: 11px; }
.place-name { flex: 1; color: var(--ink2); font-weight: 700; }
.place-track { width: 90px; height: 8px; border-radius: 4px; background: var(--ice2); overflow: hidden; }
.place-fill { height: 100%; background: var(--blue-soft); border-radius: 4px; }
.place-pct { width: 42px; text-align: right; font-weight: 800; color: var(--ink); }

/* ── INSIGHTS STRIP ── */
.insights-strip { display: flex; align-items: stretch; background: var(--blue-deep); border-radius: 18px; margin-top: 16px; overflow-x: auto; }
.is-head { display: flex; align-items: center; gap: 8px; padding: 16px 18px; color: white; font-weight: 900; font-size: 12px; white-space: nowrap; border-right: 1px solid rgba(255,255,255,.15); }
.is-head svg { color: #FFD166; }
.is-item { padding: 12px 18px; min-width: 150px; border-right: 1px solid rgba(255,255,255,.1); }
.is-item:last-child { border-right: none; }
.is-l { font-size: 9.5px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: #9FC3EE; margin-bottom: 6px; }
.is-v { font-size: 13.5px; font-weight: 900; color: white; line-height: 1.25; }
.is-v small { display:block; font-size: 10.5px; font-weight: 700; color: #BFE0FF; margin-top: 2px; }

/* ── EXPORT ── */
.export-wrap { max-width: 1360px; margin: 0 auto; padding: 0 22px 50px; }
.btn-export {
  background: var(--navy); color: white; border: none; padding: 16px; border-radius: 16px;
  font-size: 14px; font-weight: 800; cursor: pointer; width: 100%;
  box-shadow: 0 4px 18px rgba(11,56,109,.3); font-family: inherit; letter-spacing: .3px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform .15s, box-shadow .15s;
}
.btn-export:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(11,56,109,.4); }
.btn-export:disabled { opacity: .5; cursor: default; transform: none; }

/* ── STATES ── */
.state-box { text-align: center; padding: 64px 24px; color: var(--ink3); }
.state-ico { color: var(--blue-soft); margin-bottom: 16px; display: flex; justify-content: center; }
.state-box p { font-size: 14px; line-height: 1.75; font-weight: 600; }
.state-box strong { color: var(--blue); }
.spinner { width: 38px; height: 38px; border: 3px solid var(--ice); border-top-color: var(--blue); border-radius: 50%; animation: spin .75s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.err-box { background: #FFF0F0; border: 1.5px solid #FCA5A5; border-radius: 14px; padding: 14px; color: #DC2626; font-size: 13px; margin: 14px 0; font-weight: 700; }
</style>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="side-mark">F</div>
    <nav class="side-nav">
      <button class="side-ico active" type="button" title="Dashboard" id="icGrid"></button>
      <button class="side-ico" type="button" title="Desempenho" id="icBars"></button>
      <button class="side-ico" type="button" title="Campanhas" id="icMega"></button>
      <button class="side-ico" type="button" title="Público" id="icPeople"></button>
      <button class="side-ico" type="button" title="Criativos" id="icImg"></button>
      <button class="side-ico" type="button" title="Insights" id="icBolt"></button>
    </nav>
    <div class="side-bottom">
      <button class="side-ico" type="button" title="Configurações" id="icGear"></button>
      <button class="side-ico" type="button" title="Ajuda" id="icHelp"></button>
      <div class="side-avatar">AF<span class="avatar-dot"></span></div>
    </div>
  </aside>

  <div class="main">
    <div class="setup-bar">
      <label>Período:</label>
      <select id="datePreset" onchange="reloadTab()">
        <option value="this_month">Mês atual</option>
        <option value="last_month">Mês anterior</option>
        <option value="last_7d">Últimos 7 dias</option>
        <option value="last_30d">Últimos 30 dias</option>
        <option value="this_year">Este ano</option>
      </select>
      <button class="btn-connect" onclick="reloadTab()">Atualizar</button>
      <button class="btn-connect btn-bulk" id="btnBulk" onclick="exportAllClients()">Baixar todos os clientes</button>
    </div>

    <div class="tabs-wrap" id="tabsWrap"></div>

    <div class="page" id="dashPage">
      <div class="state-box">
        <div class="spinner"></div>
        <p>Carregando dados…</p>
      </div>
    </div>

    <div class="export-wrap" id="exportWrap">
      <button class="btn-export" id="btnExport" onclick="exportImage()"> Exportar como imagem</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/* ── ICONS ── */
const IC = {
  grid:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>',

async function gql(path, params={}) {
  const url = new URL('/api/meta', window.location.origin);
  url.searchParams.set('path', path);
  for (const [k,v] of Object.entries(params)) url.searchParams.set(k,v);
  const r = await fetch(url);
  const raw = await r.text();
  let d;
  try { d = JSON.parse(raw); }
  catch {
    throw new Error(`ROTA_NAO_ENCONTRADA: a chamada para /api/meta não devolveu JSON (status ${r.status}). O Vercel respondeu com uma página HTML — provavelmente a função api/meta.js não foi encontrada nesse deploy. Confira em Deployments → (deploy atual) → Source se a pasta api/ foi enviada, e na aba Functions se "meta" aparece listada.`);
  }
  if (d.error) throw new Error(d.error.message);
  return d;
}

}

/* previous-period window, used for the delta (▲/▼) badges on the KPI cards */
function prevRange(preset) {
  const day = 24*60*60*1000;
  const fmt = d => d.toISOString().slice(0,10);
  const now = new Date();
  if (preset === 'last_7d') {
    const until = new Date(now - day), since = new Date(until - 6*day);
    return { since: fmt(new Date(since - 7*day)), until: fmt(new Date(since - day)) };
  }
  if (preset === 'last_30d') {
    const until = new Date(now - day), since = new Date(until - 29*day);
    return { since: fmt(new Date(since - 30*day)), until: fmt(new Date(since - day)) };
  }
  if (preset === 'this_month') {
    const firstThis = new Date(now.getFullYear(), now.getMonth(), 1);
    const prevLast = new Date(firstThis - day);
    const prevFirst = new Date(prevLast.getFullYear(), prevLast.getMonth(), 1);
    const untilDay = Math.min(now.getDate(), prevLast.getDate());
    return { since: fmt(prevFirst), until: fmt(new Date(prevFirst.getFullYear(), prevFirst.getMonth(), untilDay)) };
  }
  if (preset === 'last_month') {
    const firstThis = new Date(now.getFullYear(), now.getMonth(), 1);
    const lastMonthLast = new Date(firstThis - day);
    const lastMonthFirst = new Date(lastMonthLast.getFullYear(), lastMonthLast.getMonth(), 1);
    const prevLast = new Date(lastMonthFirst - day);
    const prevFirst = new Date(prevLast.getFullYear(), prevLast.getMonth(), 1);
    return { since: fmt(prevFirst), until: fmt(prevLast) };
  }
  if (preset === 'this_year') {
    return { since: fmt(new Date(now.getFullYear()-1,0,1)), until: fmt(new Date(now.getFullYear()-1, now.getMonth(), now.getDate())) };
  }
  return null;
}

const FIELDS = 'spend,reach,impressions,clicks,inline_link_clicks,ctr,cpm,cpc,frequency,actions,action_values';
/* candidate action_types for "conversas iniciadas" — o Meta usa nomes diferentes conforme o canal
   (WhatsApp / Messenger / Direct do Instagram); mantemos vários candidatos e usamos o primeiro que vier
   preenchido. Vale conferir contra a documentação atual da Marketing API se os números baterem estranho. */
const MSG_TYPES = [
  'onsite_conversion.messaging_conversation_started_7d',
  'onsite_conversion.total_messaging_connection',
  'onsite_conversion.messaging_first_reply',
];

async function fetchAll(acc, preset) {
  const act = `act_${acc.id}`;
  const pr = prevRange(preset);

  const totals   = await gql(`${act}/insights`, { fields: FIELDS, date_preset: preset })
    .catch(e => { throw new Error('[1/8 insights] ' + e.message); });
  const prevTotals = pr
    ? await gql(`${act}/insights`, { fields: FIELDS, time_range: JSON.stringify(pr) }).catch(() => ({data:[]}))
    : { data: [] };
  const camps = await gql(`${act}/campaigns`, { fields: 'name,objective,effective_status', limit: 50 })
    .catch(e => { throw new Error('[2/8 campaigns] ' + e.message); });
  const campIns = await gql(`${act}/insights`, {
    level: 'campaign', fields: `campaign_id,campaign_name,${FIELDS}`, date_preset: preset, limit: 30
  }).catch(e => { throw new Error('[3/8 campaign insights] ' + e.message); });
  const adsIns = await gql(`${act}/insights`, {
    level:'ad', fields:'ad_id,ad_name,spend,reach,impressions,clicks,actions', date_preset:preset, limit:20
  }).catch(e => { throw new Error('[4/8 ad insights] ' + e.message); });
  const daily = await gql(`${act}/insights`, {
    fields:'spend,actions', time_increment:1, date_preset:preset, limit:90
  }).catch(() => ({data:[]}));
  const genderAge = await gql(`${act}/insights`, {
    fields:'reach', breakdowns:'age,gender', date_preset:preset, limit:100
  }).catch(() => ({data:[]}));
  const placements = await gql(`${act}/insights`, {
    fields:'impressions', breakdowns:'publisher_platform,platform_position', date_preset:preset, limit:50
  }).catch(() => ({data:[]}));
  const hourly = await gql(`${act}/insights`, {
    fields:'actions', breakdowns:'hourly_stats_aggregated_by_advertiser_time_zone', date_preset:preset, limit:48
  }).catch(() => ({data:[]}));

  const campInsMap = {};
  (campIns.data||[]).forEach(c => { campInsMap[c.campaign_id] = c; });
  const campaigns = (camps.data||[])
    .map(c => ({ ...c, _ins: campInsMap[c.id] || null }))
    .filter(c => Number(c._ins?.impressions||0) > 1);

  const rawAds = (adsIns.data||[])
    .filter(a => Number(a.impressions||0) > 1)
    .sort((a,b) => Number(b.reach||0) - Number(a.reach||0))
    .slice(0,3);
  const topAds = await Promise.all(rawAds.map(async ad => {
    try {
      const d = await gql(ad.ad_id, { fields:'creative{thumbnail_url,image_url}' });
      return { ...ad, thumb: d.creative?.thumbnail_url || d.creative?.image_url || null };
    } catch { return { ...ad, thumb:null }; }
  }));

  return {
    summary: totals.data?.[0]||{},
    prevSummary: prevTotals.data?.[0]||null,
    campaigns, topAds,
    daily: daily.data||[],
    genderAge: genderAge.data||[],
    placements: placements.data||[],
    hourly: hourly.data||[],
  };
}

/* ── helpers: deltas, objective, funnel insight ── */
function pctDelta(cur, prev) {
  if (!prev) return null;
  const c = Number(cur)||0, p = Number(prev)||0;
  if (!p) return null;
  return ((c - p) / p) * 100;
}
function deltaBadge(pct, goodIsUp=true) {
  if (pct === null || !isFinite(pct)) return '<span class="kpi-extra">sem período anterior</span>';
  const up = pct >= 0;
  const good = goodIsUp ? up : !up;
  return `<span class="delta ${good?'good':'bad'}">${up?IC.arrowUp:IC.arrowDown} ${Math.abs(pct).toFixed(1)}%</span>`;
}
function objectiveInfo(campaigns) {
  const counts = {};
  campaigns.forEach(c => { counts[c.objective] = (counts[c.objective]||0)+1; });
  const top = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
  const obj = top ? top[0] : '';
  const MAP = {
    OUTCOME_ENGAGEMENT:['gerar mensagens',IC.chat], MESSAGES:['gerar mensagens',IC.chat],
    OUTCOME_LEADS:['gerar leads',IC.target], LEAD_GENERATION:['gerar leads',IC.target],

    OUTCOME_AWARENESS:['gerar reconhecimento',IC.eye], BRAND_AWARENESS:['gerar reconhecimento',IC.eye], REACH:['gerar alcance',IC.eye],
  };
  return MAP[obj] || ['performance', IC.bolt];
}

/* ── charts (hand-built SVG, no external chart lib) ── */
function lineChartSVG(points, { color = '#1168C8', money = false } = {}) {
  if (!points.length) return '<p class="no-data">Sem dados no período.</p>';
  const width = 400, height = 168, pad = { l: 34, r: 8, t: 10, b: 22 };
  const w = width - pad.l - pad.r, h = height - pad.t - pad.b;
  const max = Math.max(...points.map(p => p.v), 1);
  const stepX = points.length > 1 ? w / (points.length - 1) : 0;
  const x = i => pad.l + i * stepX;
  const y = v => pad.t + h - (v / max) * h;
  const path = points.map((p,i) => `${i===0?'M':'L'} ${x(i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(' ');
  const area = `${path} L ${x(points.length-1).toFixed(1)} ${(pad.t+h).toFixed(1)} L ${x(0).toFixed(1)} ${(pad.t+h).toFixed(1)} Z`;
  const gid = 'lg' + Math.random().toString(36).slice(2,8);
  const gridLines = [0,0.5,1].map(f => {
    const gy = pad.t + h - f*h;
    const val = money ? BRL(max*f) : N(Math.round(max*f));
    return `<line x1="${pad.l}" y1="${gy.toFixed(1)}" x2="${width-pad.r}" y2="${gy.toFixed(1)}" stroke="#E4EEF9" stroke-width="1"/><text x="0" y="${(gy+3).toFixed(1)}" font-size="8.5" fill="#7A8A99" font-family="Montserrat">${val}</text>`;
  }).join('');
  const everyN = Math.max(1, Math.ceil(points.length/6));
  const xLabels = points.map((p,i)=>({p,i})).filter(o => o.i % everyN === 0)
    .map(o => `<text x="${x(o.i).toFixed(1)}" y="${height-4}" font-size="8.5" fill="#7A8A99" text-anchor="middle" font-family="Montserrat">${o.p.label}</text>`).join('');
  const lastX = x(points.length-1), lastY = y(points[points.length-1].v);
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.25"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    ${gridLines}
    <path d="${area}" fill="url(#${gid})" stroke="none"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="3.6" fill="${color}" stroke="white" stroke-width="1.8"/>
    ${xLabels}
  </svg>`;
}
function donutSVG(segments, size=120, stroke=22) {
  const r = (size - stroke)/2, c = 2*Math.PI*r;
  let offset = 0;
  const circles = segments.map(s => {
    const len = Math.max((s.pct/100)*c, 0);
    const el = `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${stroke}" stroke-dasharray="${len.toFixed(1)} ${(c-len).toFixed(1)}" stroke-dashoffset="${(-offset).toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/>`;
    offset += len;
    return el;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${circles}</svg>`;
}

function campIcon(name='', obj='') {
  const t = (name+obj).toUpperCase();
  if (t.includes('WHATSAPP')||t.includes('MENSAGE')||t.includes('MESSAGE')) return IC.chat;
  if (t.includes('VENDA')||t.includes('CONVERS')) return IC.bag;
  if (t.includes('LEAD')) return IC.target;
  if (t.includes('ALCAN')||t.includes('REACH')) return IC.eye;
  return IC.mega;
}

function buildReport(acc, { summary, prevSummary, campaigns, topAds, daily, genderAge, placements, hourly }) {
  const [objLabel, objIcon] = objectiveInfo(campaigns);

  const linkClicks = Number(summary.inline_link_clicks || av(summary.actions,['link_click']) || 0);
  const conversas   = av(summary.actions, MSG_TYPES);
  const prevConversas = prevSummary ? av(prevSummary.actions, MSG_TYPES) : null;
  const custoConv   = conversas ? Number(summary.spend||0)/conversas : 0;
  const prevCustoConv = (prevSummary && prevConversas) ? Number(prevSummary.spend||0)/prevConversas : null;
  const taxaConversao = linkClicks ? (conversas/linkClicks*100) : 0;
  const ctrLink = summary.impressions ? (linkClicks/Number(summary.impressions)*100) : 0;

  /* ── KPI row ── */
  const kpi = (icon,label,value,extraHtml) => `<div class="kpi-card">
      <div class="kpi-top"><div class="kpi-ico">${icon}</div><div class="kpi-label">${label}</div></div>
      <div class="kpi-value">${value}</div>
      <div class="kpi-foot">${extraHtml||''}</div>
    </div>`;
  const kpiRow = [
    kpi(IC.money,'Investimento', BRL(summary.spend), deltaBadge(pctDelta(summary.spend, prevSummary?.spend), false)),
    kpi(IC.people,'Alcance', N(summary.reach), deltaBadge(pctDelta(summary.reach, prevSummary?.reach), true)),
    kpi(IC.eye,'Impressões', N(summary.impressions), deltaBadge(pctDelta(summary.impressions, prevSummary?.impressions), true)),
    kpi(IC.cursor,'Cliques no link', N(linkClicks), `<span class="kpi-extra">CTR (link) ${ctrLink.toFixed(2)}%</span>`),
    kpi(IC.chat,'Conversas iniciadas', N(conversas), `${deltaBadge(pctDelta(conversas, prevConversas), true)}<span class="kpi-extra">Taxa de conversão ${taxaConversao.toFixed(1)}%</span>`),
    kpi(IC.money,'Custo por conversa', BRL(custoConv), `${deltaBadge(pctDelta(custoConv, prevCustoConv), false)}<span class="kpi-extra">Média anterior: ${prevCustoConv?BRL(prevCustoConv):'—'}</span>`),
  ].join('');

  /* ── funnel ── */
  const reach = Number(summary.reach||0);
  const funnelSteps = [
    { label:'Alcance', icon:IC.people, value: reach },
    { label:'Cliques no link', icon:IC.cursor, value: linkClicks },
    { label:'Conversas iniciadas', icon:IC.chat, value: conversas },
  ];
  let biggestDropIdx = 1, biggestDrop = -1;
  for (let i=1;i<funnelSteps.length;i++){
    const prevV = funnelSteps[i-1].value || 1;
    const drop = 1 - (funnelSteps[i].value/prevV);
    if (drop > biggestDrop) { biggestDrop = drop; biggestDropIdx = i; }
  }
  const funnelHtml = funnelSteps.map(s => {
    const pct = reach ? (s.value/reach*100) : 0;
    const barPct = reach ? Math.max(pct,1.5) : 0;
    return `<div class="funnel-row">
      <div class="funnel-label">${s.icon}<span>${s.label}</span><span class="fv">${N(s.value)}</span></div>
      <div class="funnel-track"><div class="funnel-fill" style="width:${barPct.toFixed(2)}%"></div></div>
      <div class="funnel-pct">${pct.toFixed(2)}%</div>
    </div>`;
  }).join('');
  const dropLabels = `${funnelSteps[biggestDropIdx-1].label} → ${funnelSteps[biggestDropIdx].label}`;

  /* ── daily series → charts ── */
  const dailyPoints = daily.map(d => ({ label: shortDate(d.date_start), v: Number(d.spend||0), conv: av(d.actions, MSG_TYPES) }));
  const msgPoints  = dailyPoints.map(p => ({ label: p.label, v: p.conv }));
  const costPoints = dailyPoints.map(p => ({ label: p.label, v: p.conv ? p.v/p.conv : 0 }));

  /* ── ranking de campanhas ── */
  const campRows = campaigns.map(c => {
    const ins = c._ins || {};
    const conv = av(ins.actions, MSG_TYPES);
    const cc = conv ? Number(ins.spend||0)/conv : Infinity;
    return { ...c, ins, conv, cc };
  }).sort((a,b) => Number(b.ins.spend||0) - Number(a.ins.spend||0));
  const finiteCosts = campRows.filter(c=>isFinite(c.cc)).map(c=>c.cc);
  const avgCC = finiteCosts.length ? finiteCosts.reduce((a,b)=>a+b,0)/finiteCosts.length : 0;
  const rankRows = campRows.slice(0,6).map((c,i) => `<tr>
      <td><div class="rank-num">${i+1}</div></td>
      <td><div class="rank-camp"><div class="rank-camp-ico">${campIcon(c.name,c.objective)}</div><div class="rank-camp-name" title="${c.name}">${c.name}</div></div></td>
      <td class="num">${BRL(c.ins.spend)}</td>
      <td class="num">${N(c.ins.reach)}</td>
      <td class="num">${N(c.ins.clicks)}</td>
      <td class="num">${N(c.conv)}</td>
      <td class="num">${isFinite(c.cc)?BRL(c.cc):'—'}</td>
      <td class="trend">${isFinite(c.cc) && avgCC ? (c.cc>avgCC ? `<span class="trend-ico up">${IC.arrowUp}</span>` : `<span class="trend-ico down">${IC.arrowDown}</span>`) : ''}</td>
    </tr>`).join('');
  const rankTable = campRows.length===0 ? '<p class="no-data">Nenhuma campanha veiculou no período.</p>' : `
    <div style="overflow-x:auto"><table class="rank">
      <thead><tr><th>#</th><th>Campanha</th><th>Investimento</th><th>Alcance</th><th>Cliques</th><th>Conversas</th><th>Custo/conv.</th><th></th></tr></thead>
      <tbody>${rankRows}</tbody>
    </table></div>
    ${campRows.length>6 ? `<div class="rank-more"><a href="#">Ver todas as campanhas →</a></div>` : ''}`;

  /* ── donut investimento por campanha ── */
  const COLORS = ['#0B386D','#1168C8','#3DA0E6','#8FC7EF','#C9E1F5'];
  const totalSpend = campRows.reduce((s,c)=>s+Number(c.ins.spend||0),0) || 1;
  const top4 = campRows.slice(0,4);
  const restSpend = campRows.slice(4).reduce((s,c)=>s+Number(c.ins.spend||0),0);
  const donutData = top4.map((c,i)=>({ name:c.name, pct: Number(c.ins.spend||0)/totalSpend*100, color: COLORS[i] }));
  if (restSpend>0) donutData.push({ name:'Outras', pct: restSpend/totalSpend*100, color: COLORS[4] });
  const donutLegend = donutData.map(d => `<div class="legend-row"><span class="legend-dot" style="background:${d.color}"></span><span class="legend-name" title="${d.name}">${d.name}</span><span class="legend-pct">${d.pct.toFixed(1)}%</span></div>`).join('');

  /* ── melhores anúncios ── */
  const adsWithConv = topAds.map(a => ({ ...a, conv: av(a.actions, MSG_TYPES) }));
  const thumb = ad => ad.thumb
    ? `<img class="ad-thumb" src="${ad.thumb}" crossorigin="anonymous" alt="" onerror="this.outerHTML='<div class=ad-thumb-ph>${IC.img20.replace(/"/g,'&quot;')}</div>'">`
    : `<div class="ad-thumb-ph">${IC.img20}</div>`;
  const adsHtml = adsWithConv.length===0 ? '<p class="no-data">Sem dados de anúncios no período.</p>' : adsWithConv.map((ad,i) => `
    <div class="ad-item">
      ${i===0?`<div><div class="top1-seal">★ MELHOR DESEMPENHO</div></div>`:''}
      <div class="rank-badge ${['rb-1','rb-2','rb-3'][i]||'rb-3'}">${i+1}</div>
      ${thumb(ad)}
      <div class="ad-info">
        <div class="ad-name" title="${ad.ad_name}">${ad.ad_name}</div>
        <div class="ad-metrics">
          <div><div class="am-l">Conversas</div><div class="am-v">${N(ad.conv)}</div></div>
          <div><div class="am-l">Custo/conv.</div><div class="am-v">${ad.conv?BRL(Number(ad.spend)/ad.conv):'—'}</div></div>
        </div>
      </div>
    </div>`).join('');

  /* ── perfil do público ── */
  const genderTotals = { male:0, female:0, other:0 };
  genderAge.forEach(r => {
    const v = Number(r.reach||0);
    if (r.gender==='male') genderTotals.male += v;
    else if (r.gender==='female') genderTotals.female += v;
    else genderTotals.other += v;
  });
  const genderSum = genderTotals.male + genderTotals.female + genderTotals.other || 1;
  const mPct = genderTotals.male/genderSum*100, fPct = genderTotals.female/genderSum*100;
  const genderDonut = donutSVG([
    { pct: fPct, color: '#0B386D' },
    { pct: mPct, color: '#3DA0E6' },
  ].filter(s=>s.pct>0), 120, 22);

  const AGE_BUCKETS = ['13-17','18-24','25-34','35-44','45-54','55+'];
  const ageTotals = {}; AGE_BUCKETS.forEach(b=>ageTotals[b]=0);
  genderAge.forEach(r => {
    const b = (r.age==='55-64'||r.age==='65+') ? '55+' : r.age;
    if (ageTotals[b] !== undefined) ageTotals[b] += Number(r.reach||0);
  });
  const ageSum = Object.values(ageTotals).reduce((a,b)=>a+b,0) || 1;
  const ageBars = AGE_BUCKETS.map(b => {
    const pct = ageTotals[b]/ageSum*100;
    return `<div class="age-bar-row"><span>${b}</span><div class="age-bar-track"><div class="age-bar-fill" style="width:${Math.max(pct,1).toFixed(1)}%"></div></div><span class="age-bar-pct">${pct.toFixed(0)}%</span></div>`;
  }).join('');

  const PLACE_LABEL = {
    'instagram|feed':'Feed do Instagram','instagram|story':'Stories do Instagram','instagram|reels':'Reels do Instagram',
    'facebook|feed':'Feed do Facebook','facebook|story':'Stories do Facebook','facebook|video_feeds':'Vídeos do Facebook',
    'audience_network|classic':'Audience Network','messenger|messenger_home':'Messenger',
  };
  const placeTotals = {};
  placements.forEach(r => {
    const key = `${r.publisher_platform}|${r.platform_position}`;
    placeTotals[key] = (placeTotals[key]||0) + Number(r.impressions||0);
  });
  const placeSum = Object.values(placeTotals).reduce((a,b)=>a+b,0) || 1;
  const placeTop = Object.entries(placeTotals).sort((a,b)=>b[1]-a[1]).slice(0,4);
  const placeHtml = placeTop.length===0 ? '<p class="no-data">Sem dados de posicionamento.</p>' : placeTop.map(([key,val]) => {
    const pct = val/placeSum*100;
    const label = PLACE_LABEL[key] || key.replace('|',' · ');
    const isInsta = key.startsWith('instagram');
    return `<div class="place-row"><div class="place-ico">${isInsta?IC.insta:IC.fb}</div><span class="place-name">${label}</span><div class="place-track"><div class="place-fill" style="width:${pct.toFixed(1)}%"></div></div><span class="place-pct">${pct.toFixed(1)}%</span></div>`;
  }).join('');

  /* ── insights strip ── */
  const withConv = campRows.filter(c=>c.conv>0);
  const bestCamp = [...withConv].sort((a,b)=>a.cc-b.cc)[0];
  const mostMsgCamp = [...campRows].sort((a,b)=>b.conv-a.conv)[0];
  const ctrOf = c => Number(c.ins.impressions) ? Number(c.ins.inline_link_clicks||c.ins.clicks||0)/Number(c.ins.impressions)*100 : 0;
  const bestCtrCamp = [...campRows].sort((a,b)=>ctrOf(b)-ctrOf(a))[0];

  const hourTotals = {};
  hourly.forEach(r => {
    const bucket = (r.hourly_stats_aggregated_by_advertiser_time_zone||'').slice(0,2);
    hourTotals[bucket] = (hourTotals[bucket]||0) + av(r.actions, MSG_TYPES);
  });
  const hourEntries = Object.entries(hourTotals).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const peakHourLabel = hourEntries.length ? `${hourEntries[0][0]}h – ${String((Number(hourEntries[0][0])+1)%24).padStart(2,'0')}h` : '—';

  const WEEKDAYS = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
  const wdTotals = {};
  daily.forEach(d => {
    const wd = new Date(d.date_start+'T12:00:00').getDay();
    wdTotals[wd] = (wdTotals[wd]||0) + av(d.actions, MSG_TYPES);
  });
  const wdEntries = Object.entries(wdTotals).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const peakDayLabel = wdEntries.length ? (w => w.charAt(0).toUpperCase()+w.slice(1))(WEEKDAYS[wdEntries[0][0]]) : '—';

  return `
  <div id="exportTarget">
    <div class="r-header">
      <div class="r-ico">${objIcon}</div>
      <div class="r-title-wrap">
        <div class="r-eyebrow">Relatório Meta Ads</div>
        <div class="r-title">${acc.name}</div>
        <div class="r-sub">Meta Ads | objetivo: <b>${objLabel}</b></div>
      </div>
      <div class="r-pills">
        <span class="pill">${IC.meta} Meta</span>
        <span class="pill">${IC.insta} ${IC.fb} Instagram + Facebook</span>
        <span class="pill">${IC.cal} Período: ${dateLabel()} <span class="caret">${IC.caret}</span></span>
        <span class="pill sync">${IC.check} Dados sincronizados via token/API Meta Ads</span>
      </div>
    </div>

    <div class="kpi-row">${kpiRow}</div>

    <div class="grid-2">
      <div class="section">
        <div class="sec-title"><div class="sec-ico">${IC.bars}</div><div class="sec-h">Jornada da campanha: onde está o maior vazamento?</div></div>
        ${funnelHtml}
        <div class="funnel-note"><b>Leitura:</b> o maior vazamento está entre <b>${dropLabels}</b>. Ajuste a segmentação e a mensagem para reduzir essa perda.</div>
      </div>
      <div class="grid-2" style="margin-bottom:0">
        <div class="section">
          <div class="chart-head"><div class="sec-title" style="margin-bottom:0"><div class="sec-ico">${IC.chat}</div><div class="sec-h">Mensagens no período</div></div><div class="chart-total"><div class="ct-l">Total</div><div class="ct-v">${N(conversas)}</div></div></div>
          ${lineChartSVG(msgPoints, { color:'#1168C8' })}
        </div>
        <div class="section">
          <div class="chart-head"><div class="sec-title" style="margin-bottom:0"><div class="sec-ico">${IC.money}</div><div class="sec-h">Custo por conversa</div></div><div class="chart-total"><div class="ct-l">Média</div><div class="ct-v">${BRL(custoConv)}</div></div></div>
          ${lineChartSVG(costPoints, { color:'#0B386D', money:true })}
        </div>
      </div>
    </div>

    <div class="grid-3">
      <div class="section">
        <div class="sec-title"><div class="sec-ico">${IC.trophy}</div><div class="sec-h">Ranking de campanhas</div></div>
        ${rankTable}
      </div>
      <div class="section">
        <div class="sec-title"><div class="sec-ico">${IC.money}</div><div class="sec-h">Investimento por campanha</div></div>
        <div class="donut-wrap">
          <div class="donut-center">${donutSVG(donutData, 120, 22)}<div class="donut-total"><div class="dt-l">Total</div><div class="dt-v">${BRL(totalSpend)}</div></div></div>
          <div class="legend">${donutLegend}</div>
        </div>
      </div>
      <div class="section">
        <div class="sec-title"><div class="sec-ico">${IC.trophy}</div><div class="sec-h">Melhores anúncios</div></div>
        ${adsHtml}
      </div>
    </div>

    <div class="section" style="margin-bottom:14px">
      <div class="sec-title"><div class="sec-ico">${IC.people}</div><div class="sec-h">Perfil do público</div></div>
      <div class="audience-grid">
        <div>
          <div style="display:flex;justify-content:center">${genderDonut}</div>
          <div class="gender-legend">
            <div class="legend-row"><span class="legend-dot" style="background:#0B386D"></span><span class="legend-name">Mulher</span><span class="legend-pct">${fPct.toFixed(0)}%</span></div>
            <div class="legend-row"><span class="legend-dot" style="background:#3DA0E6"></span><span class="legend-name">Homem</span><span class="legend-pct">${mPct.toFixed(0)}%</span></div>
          </div>
        </div>
        <div><div class="sec-h" style="margin-bottom:12px;font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em">Idade</div>${ageBars}</div>
        <div><div class="sec-h" style="margin-bottom:12px;font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em">Posicionamentos que mais geram mensagens</div>${placeHtml}</div>
      </div>
    </div>

    <div class="insights-strip">
      <div class="is-head">${IC.bolt} INSIGHTS RÁPIDOS</div>
      <div class="is-item"><div class="is-l">Melhor campanha</div><div class="is-v">${bestCamp?bestCamp.name:'—'}<small>${bestCamp?BRL(bestCamp.cc)+' por conversa':''}</small></div></div>
      <div class="is-item"><div class="is-l">Maior volume de mensagens</div><div class="is-v">${N(mostMsgCamp?.conv||0)} conversas<small>${mostMsgCamp?mostMsgCamp.name:''}</small></div></div>
      <div class="is-item"><div class="is-l">Melhor CTR (link)</div><div class="is-v">${ctrOf(bestCtrCamp||{ins:{}}).toFixed(2)}%<small>${bestCtrCamp?bestCtrCamp.name:''}</small></div></div>
      <div class="is-item"><div class="is-l">Menor custo por conversa</div><div class="is-v">${bestCamp?BRL(bestCamp.cc):'—'}<small>${bestCamp?bestCamp.name:''}</small></div></div>
      <div class="is-item"><div class="is-l">Hora de pico (mensagens)</div><div class="is-v">${peakHourLabel}<small>maior concentração</small></div></div>
      <div class="is-item"><div class="is-l">Dia da semana (mensagens)</div><div class="is-v">${peakDayLabel}<small>melhor desempenho</small></div></div>
    </div>
  </div>`;
}

async function exportImage() {
  const el = document.getElementById('exportTarget');
  if (!el) return;
  const btn = document.getElementById('btnExport');
  btn.disabled = true; btn.textContent = 'Gerando imagem…';
  try {
    const canvas = await html2canvas(el, { scale:2.5, useCORS:true, backgroundColor:'#FFFFFF', logging:false });
    const link = document.createElement('a');
    link.download = `foco_${ACCOUNTS[activeTab].name.replace(/\s+/g,'_')}_meta_ads.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch(e) { alert('Erro: '+e.message); }
  btn.disabled = false; btn.innerHTML = ' Exportar como imagem';
}

async function exportAllClients() {
  const btn = document.getElementById('btnBulk');
  const preset = document.getElementById('datePreset').value;
  const original = btn.textContent;
  btn.disabled = true;

  const offscreen = document.createElement('div');
  offscreen.className = 'page';
  offscreen.style.cssText = 'position:fixed; left:-99999px; top:0; padding:0; background:#fff;';
  document.body.appendChild(offscreen);

  const zip = new JSZip();
  const failed = [];

  for (let i = 0; i < ACCOUNTS.length; i++) {
    const acc = ACCOUNTS[i];
    btn.textContent = `Baixando ${i+1}/${ACCOUNTS.length} — ${acc.name}…`;
    try {
      const key = `${acc.id}_${preset}`;
      if (!cache[key]) cache[key] = await fetchAll(acc, preset);
      offscreen.innerHTML = buildReport(acc, cache[key]);
      await new Promise(r => setTimeout(r, 80));
      const el = offscreen.querySelector('#exportTarget');
      const canvas = await html2canvas(el, { scale:2, useCORS:true, backgroundColor:'#FFFFFF', logging:false });
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
      zip.file(`foco_${acc.name.replace(/\s+/g,'_')}_meta_ads.png`, blob);
    } catch (e) {
      failed.push(acc.name);
      console.error(`Falha em ${acc.name}:`, e.message);
    }
  }

  document.body.removeChild(offscreen);

  if (Object.keys(zip.files).length === 0) {
    alert('Não foi possível gerar nenhuma imagem. Verifique o token e tente novamente.');
  } else {
    btn.textContent = 'Compactando arquivo…';
    const content = await zip.generateAsync({ type: 'blob' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(content);
    link.download = `foco_relatorios_${preset}.zip`;
    link.click();
    if (failed.length) alert(`Concluído com falhas em: ${failed.join(', ')}`);
  }

  btn.disabled = false;
  btn.textContent = original;
}

/* boot */
document.getElementById('btnExport').innerHTML = ' Exportar como imagem';
buildTabs();
loadData(activeTab);
</script>
